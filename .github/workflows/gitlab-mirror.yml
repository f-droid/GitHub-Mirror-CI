name: Mirror on GitHub

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [jekyll-fdroid, f-droid.org-transparency-log]
    
    steps:
      - name: Mirror repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ matrix.repo }}
        run: |
          git clone --mirror "https://gitlab.com/fdroid/${REPO}.git" mirror.git
          git -C mirror.git push --mirror "https://x-access-token:${GH_TOKEN}@github.com/f-droid/${REPO}.git"
