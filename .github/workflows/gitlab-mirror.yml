name: Mirror on GitHub

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: repository-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - jekyll-fdroid
          - f-droid.org-transparency-log

    steps:
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.BOT_KEY }}

      - name: Trust GitHub SSH host
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Mirror repository
        env:
          REPO: ${{ matrix.repo }}
        run: |
          git clone --mirror "https://gitlab.com/fdroid/${REPO}.git" mirror.git
          git -C mirror.git push --mirror "git@github.com:f-droid/${REPO}.git"
